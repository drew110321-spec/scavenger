<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c1013"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="planet" cx="37%" cy="33%" r="75%">
      <stop offset="0" stop-color="#ff8a6c"/>
      <stop offset="0.45" stop-color="#ff4b2b"/>
      <stop offset="1" stop-color="#a7260f"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="80%">
      <stop offset="0" stop-color="#ffd0c2"/>
      <stop offset="1" stop-color="#ff6a4a"/>
    </radialGradient>
  </defs>

  <rect width="160" height="100" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="26" cy="20" r="1" opacity="0.85"/>
    <circle cx="132" cy="26" r="1.2" opacity="0.9"/>
    <circle cx="120" cy="74" r="0.9" opacity="0.7"/>
    <circle cx="38" cy="76" r="0.8" opacity="0.65"/>
    <circle cx="98" cy="16" r="0.7" opacity="0.6"/>
    <circle cx="16" cy="52" r="0.7" opacity="0.5"/>
    <circle cx="146" cy="58" r="0.8" opacity="0.6"/>
  </g>

  <!-- orbit path, behind the planet -->
  <ellipse cx="80" cy="50" rx="50" ry="19" transform="rotate(-24 80 50)"
    fill="none" stroke="#ff4b2b" stroke-width="2.6" opacity="0.5"/>

  <!-- planet -->
  <circle cx="80" cy="50" r="20" fill="url(#planet)"/>
  <ellipse cx="72" cy="42" rx="6.5" ry="4.5" fill="#ffffff" opacity="0.18"/>

  <!-- moon riding the orbit, in front -->
  <circle cx="121.5" cy="33" r="4.2" fill="url(#moon)"/>
</svg>
