services:
  - type: web
    name: prank-messenger
    runtime: python
    buildCommand: pip install -r requirements-messenger.txt
    startCommand: gunicorn messenger:app --bind 0.0.0.0:$PORT

  - type: web
    name: hey-claude
    runtime: python
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SERVER_API_KEY
        sync: false
