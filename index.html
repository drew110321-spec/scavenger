<body class="booting">
  <div class="space" aria-hidden="true">
    <canvas id="wallpaper"></canvas>
    <canvas id="stars"></canvas>
  </div>

  <main id="desktop">
    <div id="icons" class="icons" role="list" aria-label="Desktop"></div>
    <div id="snap" class="snap" hidden></div>
  </main>

  <div id="start" class="flyout start" role="dialog" aria-label="Start" hidden></div>
  <div id="qs" class="flyout qs" role="dialog" aria-label="Quick settings" hidden></div>
  <div id="cal" class="flyout cal" role="dialog" aria-label="Calendar" hidden></div>

  <footer id="taskbar" class="taskbar">
    <div class="tb-center">
      <button id="start-btn" class="tb-btn start-btn" type="button" title="Start" aria-label="Start"></button>
      <div id="task-apps" class="tb-apps"></div>
    </div>
    <div class="tray">
      <button id="qs-btn" class="tray-btn" type="button" title="Quick settings" aria-label="Quick settings">
        <span id="net-ico" class="tray-ico"></span>
        <span id="bat-ico" class="tray-ico" hidden></span>
      </button>
      <button id="clock-btn" class="tray-btn clock" type="button" aria-label="Clock and calendar">
        <span id="clock-time"></span>
        <span id="clock-date"></span>
      </button>
      <button id="show-desktop" class="show-desktop" type="button" title="Show desktop" aria-label="Show desktop"></button>
    </div>
  </footer>

  <div id="lock" class="lock" hidden>
    <div class="lock-time"></div>
    <div class="lock-date"></div>
    <div class="lock-hint">Click or press any key to unlock</div>
  </div>
  <div id="night" class="night" hidden></div>
  <div id="dim" class="dim"></div>

  <script src="library.js"></script>
  <script src="wallpaper.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
