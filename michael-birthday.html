:root{
  --ink:#06070B;        /* theatre black, blue-biased */
  --gate:#0E1118;       /* lifted black inside the frame */
  --leader:#EDE6D6;     /* film-leader cream */
  --flare:#4EA3FF;      /* anamorphic blue */
  --flame:#F0A93C;      /* candle amber */
  --slate:#7C8598;      /* cool slate for technical type */
  --s:1;                /* frame scale, set from JS */
  --fh:100vh;           /* visible frame height, set from JS */
  --bar:0px;            /* letterbox bar height, set from JS */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--leader);
  font-family:"Big Shoulders",'Arial Narrow',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#theater{position:fixed;inset:0;background:var(--ink);overflow:hidden}

/* ---- the gate: everything composites inside the frame ---- */
#weave{position:absolute;inset:0;z-index:1;will-change:transform}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}

#cards{position:absolute;inset:0;z-index:2}
.card{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--s) * 18px);
  text-align:center;
  padding:0 6%;
  opacity:0;
  filter:blur(calc(var(--s) * 14px));
  transform:scale(1.05);
  transition:opacity 700ms ease, filter 900ms ease, transform 1200ms cubic-bezier(.16,.8,.3,1);
  pointer-events:none;
}
.card.on{opacity:1;filter:blur(0);transform:scale(1)}
.above-flame .slug{color:var(--leader);opacity:.78}
/* lifted clear of the candle flame, which owns the middle of the frame */
.card.above-flame{justify-content:center;transform:scale(1.05) translateY(calc(var(--fh) * -0.27))}
.card.above-flame.on{transform:scale(1) translateY(calc(var(--fh) * -0.27))}

/* ---- type roles ---- */
.slug{
  font-family:"DM Mono",ui-monospace,monospace;
  font-size:max(10px,calc(var(--s) * 13px));

  text-indent:.42em;

}

/* ---- end credits crawl ---- */
#creditwrap{
  position:absolute;inset:0;z-index:2;
  display:flex;justify-content:center;
  overflow:hidden;
  opacity:0;
  transition:opacity 900ms ease;
  pointer-events:none;

          mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 78%,transparent 100%);
}

  position:absolute;top:100%;left:0;right:0;

  width:min(88%,calc(var(--s) * 720px));
  display:grid;

}
#crawl .role{text-align:right;color:var(--slate)}
#crawl .who{text-align:left;color:var(--leader);opacity:.92}

}

/* ---- anamorphic flare ---- */
#flare{
  position:absolute;left:0;right:0;top:50%;z-index:3;
  height:0;pointer-events:none;

}

#flare .streak{

}

  background:radial-gradient(closest-side,rgba(120,190,255,.42),rgba(78,163,255,.10) 55%,transparent 72%);
  filter:blur(calc(var(--s) * 12px));
}

  background:radial-gradient(closest-side,#fff,rgba(190,225,255,.7) 45%,transparent 70%);

}

/* ---- grade layers ---- */
#vignette{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:
    radial-gradient(120% 88% at 50% 50%,transparent 42%,rgba(3,4,7,.55) 82%,rgba(3,4,7,.92) 100%);

}

/* ---- controls ---- */
#start{
  position:absolute;inset:0;z-index:7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--s) * 22px);

  border:1px solid rgba(237,230,214,.4);

}
/* reduced motion: the still frame stays visible, the control steps aside */
#start.compact{
  --ring:calc(var(--s) * 46px);

<div id="theater">

<script>
(() => {
"use strict";

const NAME = "MICHAEL";          // the birthday star
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================================================
   FRAME — a 2.39:1 gate, letterboxed, with everything scaled
   off a 1200x500 reference frame.
   ============================================================ */
const theater = document.getElementById("theater");
const barTop  = document.querySelector(".bar.top");
const barBot  = document.querySelector(".bar.bot");
const fx      = document.getElementById("fx");
const grainC  = document.getElementById("grain");
const ctx2    = fx.getContext("2d");
const gctx    = grainC.getContext("2d", { willReadFrequently: true });
const weave   = document.getElementById("weave");

let VW = 0, VH = 0, FH = 0, DPR = 1, barH = 0, barsIn = false;

function targetBar(){
  // true 2.39:1 on wide screens; a restrained bar on tall ones so type stays legible
  return Math.min(Math.max((VH - VW / 2.39) / 2, 0), VH * 0.13);
}

function resize(){
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  barH = targetBar();
  FH = VH - 2 * barH;

  const s = Math.max(0.34, Math.min(VW / 1200, FH / 500));
  document.documentElement.style.setProperty("--s", s.toFixed(4));
  document.documentElement.style.setProperty("--fh", FH + "px");
  document.documentElement.style.setProperty("--bar", barH + "px");

  fx.width  = Math.round(VW * DPR); fx.height = Math.round(VH * DPR);
  ctx2.setTransform(DPR, 0, 0, DPR, 0, 0);

  grainC.width = Math.round(VW / 3); grainC.height = Math.round(VH / 3);

  if (barsIn){ barTop.style.height = barBot.style.height = barH + "px"; }
}
window.addEventListener("resize", resize);
resize();

const cards = {};
document.querySelectorAll(".card").forEach(el => cards[el.dataset.c] = el);

function show(key, dur = 800){
  const el = cards[key]; if (!el) return;
  el.style.transitionDuration = dur + "ms";
  el.classList.add("on");
}
function hide(key, dur = 420){
  const el = cards[key]; if (!el) return;
  el.style.transitionDuration = dur + "ms";
  el.classList.remove("on");
}

/* split the name into letters so it can bloom in, letter by letter */
function letterize(el, text, stagger = 90){
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const sp = document.createElement("span");
    sp.textContent = ch === " " ? " " : ch;
    sp.style.transitionDelay = (i * stagger) + "ms";
    el.appendChild(sp);
  });
}
letterize(document.getElementById("titleText"), NAME, 105);
letterize(document.getElementById("finalText"), "HAPPY BIRTHDAY", 42);
/* the closing card inverts the opening one: the wish above, the name beneath */
document.getElementById("finalSub").textContent = NAME.toLowerCase();

/* end credits */
const CREDITS = [
  ["Directed by", "The passage of time"],
  ["Starring", NAME],
  ["Cinematography", "One candle, handheld"],
  ["Original score", "Everyone, slightly off-key"],
  ["Production design", "Paper hats"],
  ["Catering", "Cake"],
  ["Best boy", "Also " + NAME[0] + NAME.slice(1).toLowerCase()],
  ["Wishes by", "Everyone who knows him"],
  ["Filmed on location", "At the party"],
  ["__", "No candles were harmed.<br>One was extinguished on purpose, by request."],
  ["__", "The Earth will be back next year<br>to do the whole thing again."],
];
const crawl = document.getElementById("crawl");
CREDITS.forEach(([role, who]) => {
  if (role === "__"){
    const d = document.createElement("div");
    d.className = "full"; d.innerHTML = who; crawl.appendChild(d);
  } else {
    const a = document.createElement("div"); a.className = "role"; a.textContent = role;
    const b = document.createElement("div"); b.className = "who";  b.innerHTML = who;
    crawl.append(a, b);
  }
});

/* ============================================================
   SCORE — everything is synthesized: drone, leader beeps,
   timpani on the cuts, a riser into the title, a music-box
   melody over the candle, and a warm chord to close.
   ============================================================ */
let A = null, master = null, wet = null, muted = false;
const VOL = 0.85;   // master level, with headroom under the limiter

function midi(n){ return 440 * Math.pow(2, (n - 69) / 12); }

function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  let a;
  try { a = new AC(); } catch (e){ return null; }

  master = a.createGain(); master.gain.value = VOL;
  const comp = a.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.release.value = .3;
  master.connect(comp); comp.connect(a.destination);

  // procedural hall
  const conv = a.createConvolver();
  const len = Math.floor(a.sampleRate * 2.8);
  const buf = a.createBuffer(2, len, a.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
  }
  conv.buffer = buf;
  wet = a.createGain(); wet.gain.value = 0.34;
  wet.connect(conv); conv.connect(master);
  return a;
}

function voice(t, freq, dur, o = {}){
  const { type = "sine", gain = .18, atk = .012, rel = .5, send = .5, detune = 0 } = o;
  const osc = A.createOscillator(); osc.type = type;
  osc.frequency.value = freq; osc.detune.value = detune;
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(gain, .0002), t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
  osc.connect(g); g.connect(master);
  if (send > 0){ const s = A.createGain(); s.gain.value = send; g.connect(s); s.connect(wet); }
  osc.start(t); osc.stop(t + dur + rel + .05);
}

function noise(t, dur, o = {}){
  const { freq = 900, q = 0.7, gain = .3, type = "bandpass", send = .4 } = o;
  const len = Math.max(1, Math.floor(A.sampleRate * (dur + .1)));
  const b = A.createBuffer(1, len, A.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = A.createBufferSource(); src.buffer = b;
  const f = A.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  if (send > 0){ const s = A.createGain(); s.gain.value = send; g.connect(s); s.connect(wet); }
  src.start(t); src.stop(t + dur + .1);
  return { filter: f, gain: g };
}

function timpani(t, freq = 62, gain = .55){
  const osc = A.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(freq * 2.6, t);
  osc.frequency.exponentialRampToValueAtTime(freq, t + .09);
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + .008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
  osc.connect(g); g.connect(master);
  const s = A.createGain(); s.gain.value = .5; g.connect(s); s.connect(wet);
  osc.start(t); osc.stop(t + 1.6);
  noise(t, .28, { freq: 220, q: .5, gain: gain * .32, type: "lowpass", send: .3 });
}

/* the projector itself: motor hum and shutter flutter behind the leader */
function projector(t, dur){
  const len = Math.floor(A.sampleRate * dur);
  const b = A.createBuffer(1, len, A.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = A.createBufferSource(); src.buffer = b;
  const f = A.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 720; f.Q.value = .7;
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(.05, t + .3);
  g.gain.setValueAtTime(.05, t + dur - .5);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lfo = A.createOscillator(); lfo.type = "triangle"; lfo.frequency.value = 24;
  const lg = A.createGain(); lg.gain.value = .022;
  lfo.connect(lg); lg.connect(g.gain);
  lfo.start(t); lfo.stop(t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur);
  voice(t, midi(36), dur - .3, { type: "triangle", gain: .02, atk: .5, rel: .5, send: .2 });
}

/* air moving across a cut */
function whoosh(t, dur = .9, gain = .10){
  const len = Math.floor(A.sampleRate * (dur + .1));
  const b = A.createBuffer(1, len, A.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = A.createBufferSource(); src.buffer = b;
  const f = A.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.5;
  f.frequency.setValueAtTime(260, t);
  f.frequency.exponentialRampToValueAtTime(3200, t + dur * .68);
  f.frequency.exponentialRampToValueAtTime(620, t + dur);
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + dur * .55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  const w = A.createGain(); w.gain.value = .5; g.connect(w); w.connect(wet);
  src.start(t); src.stop(t + dur + .1);
}

/* the breath that puts the candle out */
function puff(t){
  const dur = .5;
  const len = Math.floor(A.sampleRate * (dur + .1));
  const b = A.createBuffer(1, len, A.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = A.createBufferSource(); src.buffer = b;
  const f = A.createBiquadFilter(); f.type = "lowpass"; f.Q.value = .9;
  f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(320, t + dur);
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(.20, t + .045);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  const w = A.createGain(); w.gain.value = .35; g.connect(w); w.connect(wet);
  src.start(t); src.stop(t + dur + .1);
}

/* the wick catching */
function crackle(t){
  for (let i = 0; i < 8; i++){
    noise(t + Math.random() * .4, .045,
      { freq: 1700 + Math.random() * 2600, q: 2.2, gain: .045, send: .45 });
  }
}

function drone(t, dur, root = 55){
  [0, 0.12, 7].forEach((off, i) => {
    const osc = A.createOscillator();
    osc.type = i === 2 ? "triangle" : "sawtooth";
    osc.frequency.value = midi(root + (i === 2 ? 7 : 0));
    osc.detune.value = off * 100 * (i === 1 ? 1 : 0);
    const f = A.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(180, t);
    f.frequency.linearRampToValueAtTime(620, t + dur * .62);
    f.frequency.linearRampToValueAtTime(200, t + dur);
    const g = A.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(i === 2 ? .035 : .06, t + 3.5);
    g.gain.setValueAtTime(i === 2 ? .035 : .06, t + dur - 4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(f); f.connect(g); g.connect(master);
    const s = A.createGain(); s.gain.value = .6; g.connect(s); s.connect(wet);
    osc.start(t); osc.stop(t + dur + .2);
  });
}

function riser(t, dur){
  const src = noise(t, dur, { freq: 300, q: 3.2, gain: .16, send: .5 });
  src.filter.frequency.setValueAtTime(300, t);
  src.filter.frequency.exponentialRampToValueAtTime(5200, t + dur);
  src.gain.gain.setValueAtTime(0.0001, t);
  src.gain.gain.exponentialRampToValueAtTime(.22, t + dur * .92);
  src.gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  const osc = A.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(midi(38), t);
  osc.frequency.exponentialRampToValueAtTime(midi(62), t + dur);
  const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(.09, t + dur * .9);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .1);
  const f = A.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400;
  osc.connect(f); f.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + dur + .2);
}

function stinger(t){
  timpani(t, 48, .8);
  noise(t, 1.2, { freq: 3000, q: .4, gain: .18, type: "highpass", send: .8 });
  [36, 48, 55, 60, 64, 67].forEach((n, i) => {
    voice(t, midi(n), 2.6, {
      type: i < 2 ? "sawtooth" : "triangle",
      gain: i < 2 ? .085 : .055, atk: .02, rel: 3.2, send: .7
    });
  });
  const sub = A.createOscillator(); sub.type = "sine";
  sub.frequency.setValueAtTime(midi(36), t);
  sub.frequency.exponentialRampToValueAtTime(midi(24), t + 1.4);
  const g = A.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.3, t + .04);
  g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
  sub.connect(g); g.connect(master);
  sub.start(t); sub.stop(t + 2.3);
}

/* music box: sine + bright partials, fast decay */
function chime(t, n, gain = .17){
  const f0 = midi(n);
  [[1, gain], [2, gain * .34], [3.01, gain * .12], [4.98, gain * .05]].forEach(([m, g]) => {
    voice(t, f0 * m, .05, { type: "sine", gain: g, atk: .004, rel: 1.5 + 1 / m, send: .75 });
  });
}

/* the birthday melody, in beats */
const MELODY = [
  [67,.5],[67,.5],[69,1],[67,1],[72,1],[71,2],
  [67,.5],[67,.5],[69,1],[67,1],[74,1],[72,2],
  [67,.5],[67,.5],[79,1],[76,1],[72,1],[71,1],[69,2],
  [77,.5],[77,.5],[76,1],[72,1],[74,1],[72,2.5]
];
function playMelody(t0, bpm = 84, gain = .18){
  const b = 60 / bpm;
  let t = t0;
  MELODY.forEach(([n, d]) => {
    chime(t, n, gain);
    if (n !== 67 || Math.random() > .5) chime(t + .004, n - 12, gain * .28);
    t += d * b;
  });
  return t - t0;
}

function pad(t, dur, notes, gain = .05){
  notes.forEach(n => voice(t, midi(n), dur, {
    type: "triangle", gain, atk: 2.2, rel: 3.0, send: .8
  }));
}

/* ============================================================
   CANVAS — leader countdown, embers, candle, smoke, sparks
   ============================================================ */
const rnd = (a, b) => a + Math.random() * (b - a);

let embers = [], smoke = [], sparks = [];
function seedEmbers(n){
  embers = [];
  for (let i = 0; i < n; i++) embers.push({
    x: rnd(0, VW), y: rnd(0, VH),
    r: rnd(.4, 1.5), vy: rnd(-7, -2), vx: rnd(-4, 4),
    a: rnd(.12, .5), ph: rnd(0, 6.28)
  });
}
seedEmbers(46);

function drawEmbers(dt, t, boost = 1){
  ctx2.globalCompositeOperation = "lighter";
  for (const p of embers){
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < -10){ p.y = VH + 10; p.x = rnd(0, VW); }
    if (p.x < -10) p.x = VW + 10; if (p.x > VW + 10) p.x = -10;
    const tw = .6 + .4 * Math.sin(t * 1.6 + p.ph);
    const a = p.a * tw * boost;
    const g = ctx2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
    g.addColorStop(0, `rgba(255,236,205,${a})`);
    g.addColorStop(.4, `rgba(240,169,60,${a * .35})`);
    g.addColorStop(1, "rgba(240,169,60,0)");
    ctx2.fillStyle = g;
    ctx2.beginPath(); ctx2.arc(p.x, p.y, p.r * 7, 0, 6.2832); ctx2.fill();
  }
  ctx2.globalCompositeOperation = "source-over";
}

/* --- Academy leader --- */
function drawLeader(t){
  const cx = VW / 2, cy = VH / 2;
  const R = Math.min(VW, FH) * 0.42;
  ctx2.fillStyle = "#191c23";
  ctx2.fillRect(0, 0, VW, VH);

  ctx2.save();
  ctx2.translate(cx, cy);
  ctx2.strokeStyle = "rgba(237,230,214,.16)";
  ctx2.lineWidth = Math.max(1, R * .006);
  [1, .74, .48].forEach(k => { ctx2.beginPath(); ctx2.arc(0, 0, R * k, 0, 6.2832); ctx2.stroke(); });

  ctx2.beginPath();
  ctx2.moveTo(-VW, 0); ctx2.lineTo(VW, 0);
  ctx2.moveTo(0, -VH); ctx2.lineTo(0, VH);
  ctx2.stroke();

  // the sweeping hand — one revolution per second
  const ang = (t % 1) * 6.2832 - Math.PI / 2;
  ctx2.beginPath();
  ctx2.moveTo(0, 0);
  ctx2.arc(0, 0, R, -Math.PI / 2, ang);
  ctx2.closePath();
  ctx2.fillStyle = "rgba(237,230,214,.075)";
  ctx2.fill();
  ctx2.strokeStyle = "rgba(237,230,214,.5)";
  ctx2.beginPath(); ctx2.moveTo(0, 0);
  ctx2.lineTo(Math.cos(ang) * R, Math.sin(ang) * R); ctx2.stroke();

  const n = Math.max(2, 6 - Math.floor(t + 1));
  ctx2.fillStyle = "rgba(237,230,214,.92)";
  ctx2.font = `${Math.round(R * 1.05)}px "DM Mono", monospace`;
  ctx2.textAlign = "center"; ctx2.textBaseline = "middle";
  ctx2.fillText(String(n), 0, R * .04);
  ctx2.restore();

  // print scratches
  for (let i = 0; i < 3; i++){
    if (Math.random() > .55){
      const x = rnd(0, VW);
      ctx2.strokeStyle = `rgba(255,255,255,${rnd(.03, .12)})`;
      ctx2.lineWidth = rnd(.5, 1.4);
      ctx2.beginPath(); ctx2.moveTo(x, 0); ctx2.lineTo(x + rnd(-6, 6), VH); ctx2.stroke();
    }
  }
}

/* --- candle --- */
const candle = { life: 0, lit: false, out: false, outAt: 0, fade: 1 };
const wick = { x: 0, y: 0 };

function drawCandle(t){
  if (candle.fade <= 0.001) return;
  const cx = VW / 2;
  const H = FH;
  const bodyW = H * .085;
  const bodyH = H * .32;
  const baseY = VH / 2 + H * .31;
  const topY = baseY - bodyH;
  const rise = 1 - Math.pow(1 - Math.min(1, candle.life), 3);

  ctx2.save();
  ctx2.translate(0, (1 - rise) * H * .22);
  ctx2.globalAlpha = Math.min(1, candle.life * 1.6) * candle.fade;

  const flick = candle.lit ? (.86 + .14 * Math.sin(t * 11) + .06 * Math.sin(t * 27.3)) : 0;
  const fl = candle.out ? Math.max(0, 1 - (t - candle.outAt) / .45) : 1;
  const flameOn = candle.lit ? flick * fl : 0;

  // pool of light
  if (flameOn > 0){
    const gl = ctx2.createRadialGradient(cx, topY - H * .05, 0, cx, topY - H * .05, H * .72);
    gl.addColorStop(0, `rgba(255,196,102,${.20 * flameOn})`);
    gl.addColorStop(.35, `rgba(240,169,60,${.075 * flameOn})`);
    gl.addColorStop(1, "rgba(240,169,60,0)");
    ctx2.globalCompositeOperation = "lighter";
    ctx2.fillStyle = gl;
    ctx2.fillRect(0, 0, VW, VH);
    ctx2.globalCompositeOperation = "source-over";
  }

  // wax
  const wax = ctx2.createLinearGradient(cx - bodyW / 2, 0, cx + bodyW / 2, 0);
  wax.addColorStop(0, "#3b3830");
  wax.addColorStop(.28, "#c9c0ab");
  wax.addColorStop(.62, "#EDE6D6");
  wax.addColorStop(1, "#5d5849");
  ctx2.fillStyle = wax;
  ctx2.beginPath();
  ctx2.moveTo(cx - bodyW / 2, topY + bodyW * .18);
  ctx2.quadraticCurveTo(cx, topY - bodyW * .16, cx + bodyW / 2, topY + bodyW * .18);
  ctx2.lineTo(cx + bodyW / 2, baseY);
  ctx2.lineTo(cx - bodyW / 2, baseY);
  ctx2.closePath();
  ctx2.fill();

  // a drip down the left edge
  ctx2.fillStyle = "rgba(237,230,214,.5)";
  ctx2.beginPath();
  ctx2.moveTo(cx - bodyW / 2, topY + bodyH * .10);
  ctx2.quadraticCurveTo(cx - bodyW * .70, topY + bodyH * .28, cx - bodyW / 2, topY + bodyH * .44);
  ctx2.closePath(); ctx2.fill();

  // rim light from the flame
  if (flameOn > 0){
    ctx2.globalCompositeOperation = "lighter";
    const rim = ctx2.createLinearGradient(cx - bodyW / 2, topY, cx + bodyW / 2, topY + bodyH * .5);
    rim.addColorStop(0, `rgba(255,190,90,${.20 * flameOn})`);
    rim.addColorStop(1, "rgba(255,190,90,0)");
    ctx2.fillStyle = rim;
    ctx2.fillRect(cx - bodyW / 2, topY, bodyW, bodyH * .6);
    ctx2.globalCompositeOperation = "source-over";
  }

  // wick
  const wickH = H * .022;
  wick.x = cx; wick.y = topY - wickH + (1 - rise) * H * .22;
  ctx2.strokeStyle = candle.out ? "#2a2620" : "#312a20";
  ctx2.lineWidth = Math.max(1.2, H * .006);
  ctx2.beginPath();
  ctx2.moveTo(cx, topY + bodyW * .02);
  ctx2.quadraticCurveTo(cx + H * .006, topY - wickH * .6, cx - H * .004, topY - wickH);
  ctx2.stroke();

  // flame
  if (flameOn > 0){
    const fy = topY - wickH;
    const sway = Math.sin(t * 2.4) * H * .004 + Math.sin(t * 6.1) * H * .002;
    const fh = H * .085 * (.9 + .12 * Math.sin(t * 9.3)) * (candle.out ? fl : 1);
    const fw = H * .022 * (.92 + .1 * Math.sin(t * 13.7));

    ctx2.globalCompositeOperation = "lighter";
    const halo = ctx2.createRadialGradient(cx + sway, fy - fh * .45, 0, cx + sway, fy - fh * .45, fh * 1.9);
    halo.addColorStop(0, `rgba(255,214,140,${.42 * flameOn})`);
    halo.addColorStop(1, "rgba(255,170,60,0)");
    ctx2.fillStyle = halo;
    ctx2.beginPath(); ctx2.arc(cx + sway, fy - fh * .45, fh * 1.9, 0, 6.2832); ctx2.fill();

    // teardrop body
    const grad = ctx2.createLinearGradient(0, fy, 0, fy - fh);
    grad.addColorStop(0, `rgba(255,140,40,${.85 * flameOn})`);
    grad.addColorStop(.45, `rgba(255,198,96,${.95 * flameOn})`);
    grad.addColorStop(1, `rgba(255,250,225,${flameOn})`);
    ctx2.fillStyle = grad;
    ctx2.beginPath();
    ctx2.moveTo(cx + sway, fy);
    ctx2.bezierCurveTo(cx + sway + fw, fy - fh * .22, cx + sway + fw * .78, fy - fh * .72, cx + sway * 1.8, fy - fh);
    ctx2.bezierCurveTo(cx + sway - fw * .78, fy - fh * .72, cx + sway - fw, fy - fh * .22, cx + sway, fy);
    ctx2.fill();

    // blue base
    const bl = ctx2.createRadialGradient(cx + sway, fy - fh * .09, 0, cx + sway, fy - fh * .09, fw * .95);
    bl.addColorStop(0, `rgba(140,200,255,${.55 * flameOn})`);
    bl.addColorStop(1, "rgba(78,163,255,0)");
    ctx2.fillStyle = bl;
    ctx2.beginPath(); ctx2.arc(cx + sway, fy - fh * .09, fw * .95, 0, 6.2832); ctx2.fill();

    // white core
    ctx2.fillStyle = `rgba(255,252,240,${.55 * flameOn})`;
    ctx2.beginPath();
    ctx2.ellipse(cx + sway, fy - fh * .42, fw * .26, fh * .30, 0, 0, 6.2832);
    ctx2.fill();
    ctx2.globalCompositeOperation = "source-over";
  }
  ctx2.restore();
}

function blowOut(x, y){
  for (let i = 0; i < 30; i++) smoke.push({
    x: x + rnd(-3, 3), y: y - rnd(0, 6),
    vy: rnd(-72, -34), vx: rnd(-10, 10),
    r: rnd(3, 8), a: rnd(.14, .28), ph: rnd(0, 6.28), age: 0
  });
  for (let i = 0; i < 48; i++){
    // settle out toward the edges of the frame, so the credits stay legible
    let tx, ty;
    if (Math.random() < .55){
      tx = rnd(VW * .03, VW * .97);
      ty = Math.random() < .5 ? rnd(VH * .06, VH * .30) : rnd(VH * .72, VH * .95);
    } else {
      tx = Math.random() < .5 ? rnd(VW * .03, VW * .26) : rnd(VW * .74, VW * .97);
      ty = rnd(VH * .06, VH * .95);
    }
    sparks.push({
      x: x + rnd(-5, 5), y: y - rnd(0, 10),
      vx: rnd(-150, 150), vy: rnd(-250, -70),
      r: rnd(.5, 1.25), a: 1, ph: rnd(0, 6.28), tx, ty
    });
  }
}

function drawSmoke(dt, t){
  ctx2.globalCompositeOperation = "lighter";
  for (let i = smoke.length - 1; i >= 0; i--){
    const p = smoke[i];
    p.age += dt;
    p.x += (p.vx + Math.sin(t * 1.7 + p.ph) * 14) * dt;
    p.y += p.vy * dt;
    p.vy *= .995; p.r += 14 * dt;
    const a = p.a * Math.max(0, 1 - p.age / 3.4);
    if (a <= .002){ smoke.splice(i, 1); continue; }
    const g = ctx2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(190,196,208,${a})`);
    g.addColorStop(1, "rgba(160,170,190,0)");
    ctx2.fillStyle = g;
    ctx2.beginPath(); ctx2.arc(p.x, p.y, p.r, 0, 6.2832); ctx2.fill();
  }
  ctx2.globalCompositeOperation = "source-over";
}

let sparksSettling = false;
function drawSparks(dt, t){
  ctx2.globalCompositeOperation = "lighter";
  for (const p of sparks){
    if (sparksSettling){
      p.x += (p.tx - p.x) * Math.min(1, dt * 1.1);
      p.y += (p.ty - p.y) * Math.min(1, dt * 1.1);
      p.a += (.42 - p.a) * Math.min(1, dt * .8);   // embers cool into stars
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 14 * dt; p.vx *= .975; p.vy *= .975;
    }
    const tw = .55 + .45 * Math.sin(t * 3.1 + p.ph);
    const a = p.a * tw;
    const R = p.r * 4;
    const g = ctx2.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
    g.addColorStop(0, `rgba(255,250,240,${a})`);
    g.addColorStop(.42, `rgba(255,214,150,${a * .26})`);
    g.addColorStop(1, "rgba(255,190,110,0)");
    ctx2.fillStyle = g;
    ctx2.beginPath(); ctx2.arc(p.x, p.y, R, 0, 6.2832); ctx2.fill();
  }
  ctx2.globalCompositeOperation = "source-over";
}

/* --- film grain, dust and the odd scratch --- */
let grainAcc = 0;
function drawGrain(dt, strength){
  grainAcc += dt;
  if (grainAcc < 1 / 24) return;      // grain at 24fps, like the print
  grainAcc = 0;
  const w = grainC.width, h = grainC.height;
  const img = gctx.createImageData(w, h);
  const d = img.data;
  const amt = 255 * strength;
  for (let i = 0; i < d.length; i += 4){
    const v = 128 + (Math.random() - .5) * amt;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  gctx.putImageData(img, 0, 0);

  gctx.globalCompositeOperation = "source-over";
  for (let i = 0; i < 3; i++){
    if (Math.random() > .82){
      gctx.fillStyle = Math.random() > .5 ? "rgba(255,255,255,.5)" : "rgba(20,20,20,.5)";
      gctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 2 + .5, Math.random() * 2 + .5);
    }
  }
  if (Math.random() > .95){
    gctx.fillStyle = "rgba(255,255,255,.22)";
    gctx.fillRect(Math.random() * w, 0, .6, h);
  }
}

/* ============================================================
   DIRECTION — the cue sheet
   ============================================================ */
const flareEl = document.getElementById("flare");
function fireFlare(dur = 1500, peak = 1){
  flareEl.style.transition = "none";
  flareEl.style.opacity = "0";
  flareEl.animate([
    { transform: "translateX(-46%) scaleX(.7)", opacity: 0 },
    { transform: "translateX(-6%) scaleX(1)",   opacity: peak, offset: .42 },
    { transform: "translateX(48%) scaleX(.8)",  opacity: 0 }
  ], { duration: dur, easing: "cubic-bezier(.3,.05,.4,1)" });
}

let scene = "idle";      // idle | leader | dark | candle | stars
let started = false, t0 = 0, raf = 0, cues = [], cueIdx = 0;

function cue(at, fn){ cues.push({ at, fn }); }

  cue(15.6, () => hide("i1", 260));

  cue(19.4, () => hide("i2", 260));
  cue(20.0, () => show("i3", 520));
  cue(23.4, () => hide("i3", 260));
  cue(24.0, () => show("i4", 520));
  cue(27.4, () => hide("i4", 220));

  cue(28.6, () => { show("title", 100); document.getElementById("titleText").classList.add("lit"); });
  cue(29.9, () => fireFlare(1700, .95));

  });
  cue(49.6, () => { sparksSettling = true; scene = "stars"; });
  cue(50.4, () => {
    document.getElementById("creditwrap").classList.add("on");

      [{ transform: "translateY(0)" },
       { transform: `translateY(-${crawl.offsetHeight + VH}px)` }],

  });

function scheduleScore(){
  if (!A) return;
  const t = A.currentTime + 0.06;
  audioT0 = t;

  drone(t, 30, 43);                                  // low bed under the leader + intertitles
  projector(t + .05, 4.1);                           // motor hum and shutter behind the countdown
  [0, 1, 2, 3].forEach(i => {
    voice(t + i, 1000, .045, { type: "sine", gain: .12, atk: .002, rel: .05, send: .15 });
  });
  noise(t + 4.0, .5, { freq: 1800, q: .3, gain: .10, type: "highpass", send: .6 });

  [13.0, 16.2, 20.0, 24.0].forEach((c, i) => {
    whoosh(t + c - .55, .8, .085);                   // air across each cut
    timpani(t + c, 58 - i * 3, .42 + i * .06);
  });

  riser(t + 24.2, 4.4);
  stinger(t + 28.7);
  pad(t + 29.2, 7.0, [48, 55, 64, 67], .045);

  pad(t + 34.8, 6.0, [43, 50, 55], .032);            // bridge, so the cut to the candle isn't a hole
  whoosh(t + 36.9, 1.1, .06);
  crackle(t + 37.9);                                 // the wick catching

  const melLen = playMelody(t + 38.6, 84);           // the birthday tune, on a music box
  pad(t + 38.4, melLen + 3, [48, 55, 64], .036);

  puff(t + 46.55);                                   // the breath
  chime(t + 46.7, 84, .10);                          // the wish
  noise(t + 46.6, .55, { freq: 2600, q: .6, gain: .10, type: "bandpass", send: .7 });

  pad(t + 50.4, 20, [43, 50, 59, 62], .034);
  drone(t + 50.0, 22, 43);
  playMelody(t + 57.2, 66, .085);                    // a slower reprise under the credits

  stinger(t + 70.3);
  pad(t + 70.4, 12, [36, 48, 55, 64, 67, 74], .05);
  [79, 84, 88].forEach((n, i) => chime(t + 71.6 + i * .42, n, .085));
}

let audioT0 = 0;
function clock(){ return (performance.now() - t0) / 1000; }

let last = 0;
function frame(now){
  raf = requestAnimationFrame(frame);
  const t = (now - t0) / 1000;
  const dt = Math.min(.05, (now - last) / 1000 || .016);
  last = now;

  while (cueIdx < cues.length && t >= cues[cueIdx].at){ cues[cueIdx].fn(); cueIdx++; }

  ctx2.clearRect(0, 0, VW, VH);
  ctx2.fillStyle = "#06070B";
  ctx2.fillRect(0, 0, VW, VH);

  if (scene === "leader"){
    drawLeader(t);
  } else {
    if (scene === "dark") drawEmbers(dt, t, .55);
    if (scene === "candle" || scene === "stars"){
      candle.life = Math.min(1, candle.life + dt / 1.6);
      if (candle.out){
        // once it's out, let the candle sink away before the credits arrive
        candle.fade = Math.max(0, 1 - Math.max(0, t - candle.outAt - 1.4) / 2.2);
      }
      drawEmbers(dt, t, scene === "stars" ? .5 : .8);
      drawCandle(t);
      drawSmoke(dt, t);
      drawSparks(dt, t);
    }
  }

  // gate weave — the print never sits perfectly still
  if (scene === "leader"){
    weave.style.transform =
      `translate(${(Math.random() - .5) * 3}px, ${(Math.random() - .5) * 3.4}px)`;
  } else {
    const wx = Math.sin(t * 2.3) * .7 + Math.sin(t * 7.7) * .25;
    const wy = Math.cos(t * 1.9) * .8 + Math.sin(t * 6.1) * .3;
    weave.style.transform = `translate(${wx}px, ${wy}px)`;
  }

  drawGrain(dt, scene === "leader" ? .55 : .30);
}

function play(){
  if (started) return;
  started = true;

  A = A || initAudio();
  if (master) master.gain.value = muted ? 0 : VOL;

  document.getElementById("start").style.opacity = "0";
  setTimeout(() => document.getElementById("start").setAttribute("hidden", ""), 900);

  // reset
  Object.keys(cards).forEach(k => hide(k, 1));
  document.getElementById("titleText").classList.remove("lit");
  document.getElementById("finalText").classList.remove("lit");
  document.getElementById("creditwrap").classList.remove("on");
  document.getElementById("ui").classList.remove("show");
  crawl.getAnimations().forEach(a => a.cancel());
  smoke = []; sparks = []; sparksSettling = false;
  candle.lit = candle.out = false; candle.life = 0; candle.fade = 1;
  barsIn = false; barTop.style.height = barBot.style.height = "0px";
  scene = "idle";

  buildCues();

  const begin = () => {
    t0 = performance.now(); last = t0;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  };

  // the score is scheduled against the audio clock, which only advances once the
  // context is running — so wait for it, but never let a stuck context hold the picture
  const ready = (A && A.state === "suspended")
    ? Promise.race([A.resume().catch(() => {}), new Promise(r => setTimeout(r, 500))])
    : Promise.resolve();

  ready.then(() => {
    if (!A) setAudioAvailable(false);
    else {
      try { scheduleScore(); setAudioAvailable(true); }
      catch (e){ setAudioAvailable(false); }   // the picture plays on without the score
    }
    begin();
  });
}

function replay(){
  if (A){ try { A.close(); } catch(e){} A = null; }
  started = false;
  document.getElementById("start").setAttribute("hidden", "");
  play();
}

/* ---- controls ---- */
const startBtn = document.getElementById("start");
startBtn.addEventListener("click", play);
document.getElementById("replay").addEventListener("click", replay);

const muteBtn = document.getElementById("mute");
let audioOK = true;

/* say plainly when the browser won't give us sound, rather than showing a dead control */
function setAudioAvailable(ok){
  audioOK = ok;
  muteBtn.disabled = !ok;
  muteBtn.textContent = ok ? (muted ? "Sound off" : "Sound on") : "No sound";
  if (!ok) muteBtn.title = "This browser blocked audio playback";
}

function toggleMute(){
  if (!audioOK) return;
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : VOL;
  muteBtn.textContent = muted ? "Sound off" : "Sound on";
}
muteBtn.addEventListener("click", toggleMute);

window.addEventListener("keydown", e => {
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === "r" || e.key === "R") replay();
});

let uiTimer;
theater.addEventListener("pointermove", () => {
  const ui = document.getElementById("ui");
  if (!started) return;
  ui.classList.add("show");
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (clock() < 74) ui.classList.remove("show"); }, 2400);
});

/* ---- a still frame for anyone who'd rather not watch it move ---- */
function stillFrame(){
  barsIn = true;
  barTop.style.height = barBot.style.height = barH + "px";
  scene = "dark";
  ctx2.clearRect(0, 0, VW, VH);
  ctx2.fillStyle = "#06070B"; ctx2.fillRect(0, 0, VW, VH);
  drawEmbers(0, 0, .7);
  drawGrain(1, .3);
  show("title", 400);
  document.getElementById("titleText").classList.add("lit");
}

/* wait for the print to arrive */
document.fonts.ready.then(() => {
  startBtn.disabled = false;
  document.getElementById("startMeta").textContent = "Sound on · 76 seconds";
  if (REDUCED){
    startBtn.classList.add("compact");
    stillFrame();
  } else {
    // idle: a breathing black with grain, so it feels like a projector already running
    const idle = () => {
      if (started) return;
      ctx2.clearRect(0, 0, VW, VH);
      ctx2.fillStyle = "#06070B"; ctx2.fillRect(0, 0, VW, VH);
      drawGrain(.02, .22);
      requestAnimationFrame(idle);
    };
    idle();
  }
});

})();
</script>
